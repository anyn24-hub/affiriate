<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a855f7">
<title>おとな偏愛Lab | 楽天アフィ投稿Bot</title>
<style>
:root{
  --bg:#0f0f14;--bg2:#16161e;--card:#1c1c26;--card2:#22222e;
  --border:rgba(255,255,255,.1);--pink:#ff6b9d;--purple:#a855f7;
  --cyan:#22d3ee;--green:#4ade80;--red:#f87171;--gold:#fbbf24;
  --text:#f0f0f5;--muted:rgba(240,240,245,.55);--r:14px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;min-height:100vh;padding-bottom:60px}
.wrap{max-width:760px;margin:0 auto}

.hdr{background:linear-gradient(135deg,#0a0a12,#16101e);border-bottom:1px solid rgba(168,85,247,.35);padding:14px 20px 12px;position:sticky;top:0;z-index:100}
.hdr-inner{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.hdr-title{font-size:19px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hdr-date{font-size:13px;color:var(--cyan);font-weight:700}
.page{padding:14px 16px}

.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.sec-hd{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none;-webkit-user-select:none}
.sec-hd:active{background:rgba(255,255,255,.03)}
.badge{font-size:11px;font-weight:900;padding:4px 11px;border-radius:100px;flex-shrink:0}
.bp{background:var(--pink);color:#fff}.bpu{background:var(--purple);color:#fff}
.bc{background:var(--cyan);color:#000}
.sec-title{font-size:15px;font-weight:800;flex:1}
.chevron{color:var(--muted);font-size:14px;transition:transform .2s}
.sec.open .chevron{transform:rotate(180deg)}
.sec-body{display:none;padding:0 18px 20px;border-top:1px solid var(--border)}
.sec.open .sec-body{display:block}

.day-tabs{display:flex;gap:8px;margin:14px 0 16px}
.day-tab{flex:1;padding:12px;font-size:14px;font-weight:800;border:2px solid var(--border);border-radius:10px;background:var(--card2);color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.day-tab.active{border-color:var(--purple);color:var(--purple);background:rgba(168,85,247,.1)}
.day-tab:active{opacity:.7}

.schedule-list{display:flex;flex-direction:column;gap:7px}
@media(min-width:560px){.schedule-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
.slot{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--card2);border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.slot.sel{border-color:var(--purple);background:rgba(168,85,247,.1)}
.slot.loading{border-color:var(--cyan);background:rgba(34,211,238,.07)}
.slot:active{opacity:.7}
.slot-time{font-size:14px;font-weight:900;color:var(--cyan);min-width:50px;font-variant-numeric:tabular-nums}
.slot-cat{font-size:15px;font-weight:800;flex:1}
.slot-dot{width:18px;height:18px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;position:relative}
.slot.sel .slot-dot,.slot.loading .slot-dot{background:var(--purple);border-color:var(--purple)}
.slot.sel .slot-dot::after,.slot.loading .slot-dot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#fff}

.evt-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
@media(min-width:480px){.evt-grid{grid-template-columns:repeat(4,1fr)}}
.evt-chip{padding:10px 7px;font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--card2);color:var(--muted);text-align:center;-webkit-tap-highlight-color:transparent;transition:all .15s;line-height:1.3;font-family:inherit}
.evt-chip.active{border-color:var(--pink);color:var(--pink);background:rgba(255,107,157,.1)}

.auto-status-bar{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px}
.asb-loading{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cyan)}
.asb-ok{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:var(--green)}
.asb-warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.asb-err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:var(--red)}

.fg{margin-top:12px}
.fg label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;display:block}
.finput{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:14px;padding:11px 13px;outline:none;-webkit-appearance:none}
.finput:focus{border-color:var(--purple)}

.rank-link{display:flex;align-items:center;gap:12px;background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.25);border-radius:12px;padding:14px;text-decoration:none;color:var(--text);margin-top:4px;transition:background .15s}
.rank-link:active{background:rgba(168,85,247,.15)}
.rank-link-icon{font-size:22px}
.rank-link-body{flex:1}
.rank-link-title{font-size:14px;font-weight:800;margin-bottom:2px}
.rank-link-sub{font-size:11px;color:var(--muted)}

.prod-slot{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px}
.prod-slot-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.prod-num{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.prod-slot-name{font-size:13px;font-weight:800}
.prod-st{font-size:11px;margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border:none;border-radius:10px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{opacity:.7;transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-full{width:100%}.btn-pink{background:var(--pink);color:#fff}.btn-purple{background:var(--purple);color:#fff}
.btn-green{background:var(--green);color:#000}.btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:8px}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.out-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-all;min-height:160px;outline:none;color:var(--text)}
.out-box:focus{border-color:var(--purple)}
.char-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.char-cnt{font-size:12px;font-weight:700}
.char-ok{color:var(--green)}.char-warn{color:var(--gold)}.char-over{color:var(--red)}
.ng-box{border-radius:9px;padding:10px 13px;font-size:12px;line-height:1.7;margin-top:8px;display:none}
.ng-box.show{display:block}
.ng-ok{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.25);color:var(--green)}
.ng-warn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}

.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.sec-label{font-size:13px;font-weight:800;color:var(--purple);margin-bottom:8px}

.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:11px 24px;border-radius:100px;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;white-space:nowrap}
#toast.show{opacity:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt14{margin-top:14px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-inner">
    <div><div class="hdr-title">🛍️ おとな偏愛Lab</div><div class="hdr-sub">楽天アフィリエイト × X投稿Bot</div></div>
    <div class="hdr-date" id="hdrDate"></div>
  </div>
</div>
<div class="wrap"><div class="page">

<!-- STEP 1 -->
<div class="sec open" id="sec1">
  <div class="sec-hd" onclick="tog('sec1')">
    <span class="badge bp">STEP 1</span>
    <span class="sec-title">📅 投稿時間・カテゴリを選ぶ</span>
    <span class="chevron">▼</span>
  </div>
  <div class="sec-body">
    <div class="day-tabs">
      <button class="day-tab" id="tabWd" onclick="setDay('wd')">📅 平日（月～金）</button>
      <button class="day-tab" id="tabWe" onclick="setDay('we')">🎉 土日</button>
    </div>
    <div class="schedule-list" id="scheduleList"></div>
    <div class="mt14">
      <div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px">イベント訴求モード</div>
      <div class="evt-grid" id="evtGrid"></div>
    </div>
    <div id="evtDesc" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>
</div>

<!-- Auto status bar (shown between STEP1 and STEP2/3 during/after auto-fetch) -->
<div id="autoStatusBar" style="display:none"></div>

<!-- STEP 2: URL入力（高料率 or フォールバック） -->
<div class="sec" id="sec2" style="display:none">
  <div class="sec-hd" onclick="tog('sec2')">
    <span class="badge bpu">STEP 2</span>
    <span class="sec-title" id="sec2Title">🔗 商品URLを入力</span>
    <span class="chevron">▼</span>
  </div>
  <div class="sec-body">
    <a id="rankLink" class="rank-link" href="https://ranking.rakuten.co.jp/" target="_blank" rel="noopener">
      <span class="rank-link-icon">🏆</span>
      <div class="rank-link-body">
        <div class="rank-link-title" id="rankLinkTitle">楽天ランキングを開く</div>
        <div class="rank-link-sub">商品を選んでURLをコピー → 下に貼り付け</div>
      </div>
      <span style="color:var(--muted);font-size:16px">↗</span>
    </a>
    <div id="prodSlots"></div>
    <div class="mt12">
      <button class="btn btn-purple btn-full" onclick="generate()">✨ この商品で投稿文を生成</button>
    </div>
  </div>
</div>

<!-- STEP 3 -->
<div class="sec open" id="sec3">
  <div class="sec-hd" onclick="tog('sec3')">
    <span class="badge bc">STEP 3</span>
    <span class="sec-title">✨ 投稿文・画像を生成</span>
    <span class="chevron">▼</span>
  </div>
  <div class="sec-body">
    <button class="btn btn-purple btn-full" onclick="generate()" id="genBtn">✨ 生成する</button>
    <div id="postArea" style="display:none">
      <hr class="divider">
      <div class="sec-label">📝 投稿文</div>
      <div class="out-box" id="postBox" contenteditable="true" oninput="onInput()"></div>
      <div class="char-row">
        <span style="font-size:11px;color:var(--muted)">X用（140文字換算）</span>
        <span class="char-cnt char-ok" id="charCount">0 / 280</span>
      </div>
      <div class="ng-box" id="ngBox"></div>
      <div class="btn-row">
        <button class="btn btn-green btn-full" onclick="copyPost()">📋 X用にコピー</button>
        <button class="btn btn-ghost btn-sm" onclick="generate()">🔄 再生成</button>
      </div>
      <hr class="divider">
      <div class="sec-label">🖼️ 投稿用画像</div>
      <canvas id="cv" style="width:100%;border-radius:12px;display:block;margin-bottom:10px"></canvas>
      <div class="btn-row">
        <button class="btn btn-pink btn-full" onclick="genImg()">🖼️ 画像を再生成</button>
        <button class="btn btn-ghost btn-sm" id="dlBtn" onclick="dlImg()" style="display:none">💾 保存</button>
      </div>
    </div>
  </div>
</div>

</div></div>
<div id="toast"></div>

<script>
const CE={'スイーツ':'🍰','ガジェット':'📱','美容':'💄','ゆる健康':'🌿','高料率①':'💰','高料率②':'💎'};

  we:[{t:'09:00',c:'ガジェット'},{t:'11:00',c:'高料率①'},{t:'13:00',c:'スイーツ'},{t:'15:00',c:'高料率②'},{t:'18:00',c:'美容'},{t:'21:00',c:'ゆる健康'},{t:'21:00',c:'スイーツ'}],
};
const EVTS=['通常','お買い物マラソン','楽天スーパーSALE','5と0のつく日','買い回り','季節ギフト','訳あり・自宅用'];
const ED={'通常':'シンプルな商品紹介','お買い物マラソン':'マラソン中の買い回り訴求','楽天スーパーSALE':'SALE期間の緊急感を強調','5と0のつく日':'ポイント倍率アップ訴求','買い回り':'複数ショップ購入を誘導','季節ギフト':'ギフト用途を強調','訳あり・自宅用':'コスパ重視・自分へのご褒美'};
// genreId for Rakuten API
const CG={'スイーツ':'410899','ガジェット':'100044','美容':'216131','ゆる健康':'100533'};
// keyword for each category
const CK={'スイーツ':'スイーツ','ガジェット':'便利グッズ ガジェット','美容':'コスメ スキンケア','ゆる健康':'サプり 健康食品'};

const INTRO={
  'スイーツ':{'通常':'楽天で気になったスイーツ3選。','お買い物マラソン':'マラソン中に見ておきたい1,000円台〜のスイーツ3選。','楽天スーパーSALE':'スーパーSALE中にチェックしておきたいスイーツ3選。','5と0のつく日':'5と0のつく日に買いたいスイーツ3選。','買い回り':'買い回りついでに見たい1,000〜3,000円台のスイーツ3選。','季節ギフト':'ちょっとしたギフトにも使えるスイーツ3選。','訳あり・自宅用':'自分用に候補に入れたいスイーツ3選。'},
  'ガジェット':{'通常':'デスク周りが少し整う、楽天ガジェット3選。','お買い物マラソン':'マラソン中に見ておきたい2,000円台までの便利グッズ3選。','楽天スーパーSALE':'スーパーSALE中に見ておきたい低単価ガジェット3選。','5と0のつく日':'5と0のつく日にポイントを貯めながら見たいガジェット3選。','買い回り':'買い回りついでに見たい2,000〜4,000円台のガジェット3選。','季節ギフト':'ちょっとしたギフトにも使える実用ガジェット3選。','訳あり・自宅用':'自宅用にコスパ重視で選んだガジェット3選。'},
  '美容':{'通常':'毎日使いやすい、楽天の美容・ケアアイテム3選。','お買い物マラソン':'マラソン中にまとめ買いしておきたい美容・ケアアイテム3選。','楽天スーパーSALE':'スーパーSALE中に補充しておきたい美容消耗品3選。','5と0のつく日':'5と0のつく日にまとめ買いしたい美容消耗品3選。','買い回り':'買い回りついでに補充したい美容・ケアの消耗品3選。','季節ギフト':'ちょっとしたギフトにも使える美容アイテム3選。','訳あり・自宅用':'自宅用にコスパ重視で選んだ美容・ケアアイテム3選。'},
  'ゆる健康':{'通常':'無理なく続けられる、楽天の健康アイテム3選。','お買い物マラソン':'マラソン中にまとめて補充しておきたいゆる健康アイテム3選。','楽天スーパーSALE':'スーパーSALE中に補充しておきたいゆる健康アイテム3選。','5と0のつく日':'5と0のつく日に見ておきたい、無理なく続けやすい健康アイテム3選。','買い回り':'買い回りついでに補充したいゆる健康アイテム3選。','季節ギフト':'おやすみ前のリラックスタイムにも使えるゆる健康ギフト3選。','訳あり・自宅用':'コスパと継続しやすさで選んだゆる健康アイテム3選。'},

  '高料率②':{'通常':'価格・レビュー・用途を見て選んだ高料率アイテム3選。','お買い物マラソン':'マラソン中に見ておきたい高料率×買いやすい価格帯の候補3選。','楽天スーパーSALE':'スーパーSALE×高料率で狙いたいアイテム3選。','5と0のつく日':'5と0のつく日に狙いたい高料率アイテム3選。','買い回り':'買い回り候補に入れたい高料率×低午価アイテム3選。','季節ギフト':'ギフトにも使える高料率アイテム3選。','訳あり・自宅用':'自宅用にコスパ重視で選んだ高料率アイテム3選。'},
};
const NGW=['食べた','使ってみた','美味しかった','最高だった','リピ確定','絶対おすすめ','効果あり','痩せる','治る','肌が変わる','若返る','疲労回復','睡眠改善','血糖値','改善する','治療','効く','爆売れ','買うべき','必須','間違いない','絶対','確実','必ず'];
const NGR={'食べた':'気になる','使ってみた':'レビューを見て気になった','美味しかった':'気になる','最高だった':'良さそう','リピ確定':'候補に入れたい','絶対おすすめ':'候補に入れたい','効果あり':'続けやすそう','痩せる':'体を整えたい人向け','治る':'続けやすそう','肌が変わる':'清潔感を整えたい人向け','若返る':'整えたい人向け','疲労回復':'リラックスタイムに良さそう','睡眠改善':'おやすみ前に良さそう','改善する':'続けやすそう','治療':'ケア','効く':'良さそう','爆売れ':'人気','買うべき':'候補に入れたい','必須':'役立ちそう','間違いない':'良さそう','絶対':'ぜひ','確実':'きっと','必ず':'ぜひ'};

let day='wd',selIdx=null,selCat='',selEvt='通常',affId='',appId='',prods=[];

function tog(id){document.getElementById(id).classList.toggle('open');}
function toast(m,bad=false){const e=document.getElementById('toast');e.textContent=m;e.style.background=bad?'var(--red)':'var(--green)';e.style.color=bad?'#fff':'#000';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
function cp(t){navigator.clipboard.writeText(t).then(()=>toast('コピーしました ✓')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('コピーしました ✓');});}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function xchars(t){return [...t.replace(/https?:\/\/\S+/g,_=>'?'.repeat(23))].reduce((a,c)=>a+(c.codePointAt(0)>0x7f?2:1),0);}
function isHR(c){return HR.includes(c);}

function setStatusBar(cls,html){
  const el=document.getElementById('autoStatusBar');
  if(!cls){el.style.display='none';return;}
  el.className='auto-status-bar '+cls;
  el.innerHTML=html;
  el.style.display='flex';
}

function setDay(d){
  day=d;
  document.getElementById('tabWd').classList.toggle('active',d==='wd');
  document.getElementById('tabWe').classList.toggle('active',d==='we');
  selIdx=null;selCat='';
  renderSched();
  document.getElementById('sec2').style.display='none';
  document.getElementById('postArea').style.display='none';
  setStatusBar(null,'');
}

function renderSched(){
  document.getElementById('scheduleList').innerHTML=SCHED[day].map((s,i)=>{
    const em=CE[s.c]||'🛍️';
    const extra=i===selIdx?' sel':'';
    return `<div class="slot${extra}" id="slot_${i}" onclick="selSlot(${i})">
      <div class="slot-time">${s.t}</div>
      <div class="slot-cat">${em} ${s.c}</div>
      <div class="slot-dot"></div>
    </div>`;
  }).join('');
}

async function selSlot(i){
  if(selIdx===i)return;
  selIdx=i;
  const s=SCHED[day][i];
  selCat=s.c;
  renderSched();
  prods=[];
  document.getElementById('postArea').style.display='none';
  document.getElementById('sec3').classList.add('open');

  const hr=isHR(selCat);
  const rUrl=CR[selCat]||'https://ranking.rakuten.co.jp/';
  const rTitle=hr?'📊 楽天アフィリエイト管理画面を開く':`🏆 ${CE[selCat]||''} ${selCat}のランキングを開く`;
  document.getElementById('rankLink').href=rUrl;
  document.getElementById('rankLinkTitle').textContent=rTitle;
  document.getElementById('sec2Title').textContent=hr?'🔗 商品URLを入力（高料率）':'🔗 商品URLを入力（手動修正用）';
  renderProdSlots();

  if(hr){
    // 高料率: 手動入力へ
    setStatusBar('asb-warn','💰 高料率は自分で商品を選んでURLを貼り付けてください');
    document.getElementById('sec2').style.display='';
    document.getElementById('sec2').classList.add('open');
    const genBtn=document.getElementById('genBtn');
    genBtn.disabled=false;
    genBtn.innerHTML='✨ 生成する';
    return;
  }

  // 非高料率: 自動取得開始
  setStatusBar('asb-loading','<span class="spinner"></span>🔄 ランキング上位を取得中...');
  document.getElementById('sec2').style.display='none';
  const genBtn=document.getElementById('genBtn');
  genBtn.disabled=true;
  genBtn.innerHTML='<span class="spinner"></span>自動取得中...';

  if(!appId) await loadCfg();

  const fetched=await fetchProductsAuto();

  if(fetched.length>=3){
    // 全部3商品取得成功 → 自動生成
    prods=fetched.slice(0,3);
    fetched.forEach((p,idx)=>{
      const n=idx+1;
      const nm=document.getElementById(`nm${n}`);
      const ru=document.getElementById(`ru${n}`);
      const ul=document.getElementById(`ul${n}`);
      const st=document.getElementById(`st${n}`);
      if(nm)nm.value=p.name;
      if(ru)ru.value=p.rawUrl;
      if(ul)ul.value=p.url;
      if(st){st.textContent='✓ 自動';st.style.color='var(--green)';}
    });
    setStatusBar('asb-ok',`✅ ランキング上位3商品を取得しました — 投稿文・画像を自動生成中...`);
    buildPost(prods.map(p=>({name:p.name,url:p.url})));
    genImg();
    document.getElementById('postArea').style.display='block';
    setStatusBar('asb-ok',`✅ 自動生成完了！「修正する」から内容を編集できます`);
    // STEP2を折りたたみで表示（修正用）
    document.getElementById('sec2').style.display='';
    document.getElementById('sec2').classList.remove('open');
    genBtn.disabled=false;
    genBtn.innerHTML='🔄 再生成';
  } else if(fetched.length>0){
    // 一部取得
    fetched.forEach((p,idx)=>{
      const n=idx+1;
      const nm=document.getElementById(`nm${n}`);
      const ru=document.getElementById(`ru${n}`);
      const ul=document.getElementById(`ul${n}`);
      const st=document.getElementById(`st${n}`);
      if(nm)nm.value=p.name;
      if(ru)ru.value=p.rawUrl;
      if(ul)ul.value=p.url;
      if(st){st.textContent='✓ 自動';st.style.color='var(--green)';}
    });
    setStatusBar('asb-warn',`⚠️ ${fetched.length}商品のみ取得。残りはSTEP2で手動入力してください`);
    document.getElementById('sec2').style.display='';
    document.getElementById('sec2').classList.add('open');
    genBtn.disabled=false;
    genBtn.innerHTML='✨ 生成する';
  } else {
    // 取得失敗
    const apiNote=appId?'(楽天APIキー要確認)':'《設定》Rakuten App IDが未設定です';
    setStatusBar('asb-err',`❌ 自動取得できませんでした ${apiNote}。STEP2に手動でURLを貼り付けてください`);
    document.getElementById('sec2').style.display='';
    document.getElementById('sec2').classList.add('open');
    genBtn.disabled=false;
    genBtn.innerHTML='✨ 生成する';
  }
}

async function fetchProductsAuto(){
  const genre=CG[selCat];
  if(!genre)return[];
  if(!appId)return[];
  try{
    const kw=CK[selCat]||selCat;
    const p=new URLSearchParams({
      applicationId:appId,
      keyword:kw,
      hits:20,
      sort:'standard',
      format:'json',
      genreId:genre
    });
    if(affId)p.set('affiliateId',affId);
    const r=await fetch(`https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601?${p}`);
    const d=await r.json();
    if(!r.ok||!d.Items||!d.Items.length)return[];
    return d.Items
      .map(i=>i.Item)
      .filter(i=>i.itemName&&i.itemName.length>3)
      .slice(0,3)
      .map(it=>({
        name:it.itemName.replace(/[【-｠!-/]/g,' ').replace(/\s+/g,' ').trim().slice(0,40),
        url:it.affiliateUrl||it.itemUrl,
        rawUrl:it.itemUrl
      }));
  }catch{return[];}
}

function renderProdSlots(){
  document.getElementById('prodSlots').innerHTML=[1,2,3].map(n=>`
    <div class="prod-slot">
      <div class="prod-slot-hd"><span class="prod-num">${['①','②','③'][n-1]}</span><span class="prod-slot-name">商品${n}</span><span class="prod-st" id="st${n}"></span></div>
      <div class="fg" style="margin-top:0"><label>楽天商品URL</label>
        <div style="display:flex;gap:7px">
          <input class="finput" id="ru${n}" placeholder="https://item.rakuten.co.jp/..." autocomplete="off" spellcheck="false" inputmode="url" style="flex:1;margin:0">
          <button class="btn btn-ghost btn-sm" onclick="fetchT(${n})">取得</button>
        </div>
      </div>
      <div class="fg"><label>商品名</label><input class="finput" id="nm${n}" placeholder="取得すると自動入力" autocomplete="off"></div>
      <input type="hidden" id="ul${n}">
    </div>`).join('');
}

function renderEvts(){
  document.getElementById('evtGrid').innerHTML=EVTS.map(e=>
    `<button class="evt-chip${e===selEvt?' active':''}" onclick="setEvt('${e}')">${e}</button>`).join('');
  document.getElementById('evtDesc').textContent=ED[selEvt]||'';
}
function setEvt(e){selEvt=e;renderEvts();}

async function loadCfg(){try{const r=await fetch('/api/config');const d=await r.json();affId=d.affId||'';appId=d.appId||'';}catch{}}

async function fetchT(n){
  const raw=(document.getElementById(`ru${n}`).value||'').trim();
  if(!raw){toast('URLを入力してください',true);return;}
  const st=document.getElementById(`st${n}`);
  st.textContent='取得中...';st.style.color='var(--muted)';
  try{
    const r=await fetch(`/api/product?url=${encodeURIComponent(raw)}`);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    document.getElementById(`nm${n}`).value=d.title||'';
    document.getElementById(`ul${n}`).value=d.affiliateUrl||raw;
    st.textContent='✓ 取得';st.style.color='var(--green)';
    toast(`商品${n}を取得しました ✓`);
  }catch(e){
    st.textContent='❌ '+e.message;st.style.color='var(--red)';
    document.getElementById(`ul${n}`).value=raw;
  }
}

async function generate(){
  if(!selCat){toast('STEP1で投稿時間を選んでください',true);return;}
  const btn=document.getElementById('genBtn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>生成中...';
  try{
    prods=[1,2,3].map(i=>({
      name:(document.getElementById(`nm${i}`)?.value||'').trim(),
      url:(document.getElementById(`ul${i}`)?.value||document.getElementById(`ru${i}`)?.value||'').trim()
    })).filter(p=>p.name||p.url);
    if(!prods.length){toast('商品名またはURLを入力してください（STEP2）',true);return;}
    buildPost(prods);
    genImg();
    document.getElementById('postArea').style.display='block';
    document.getElementById('sec3').classList.add('open');
    document.getElementById('postArea').scrollIntoView({behavior:'smooth',block:'start'});
  }finally{
    btn.disabled=false;btn.innerHTML='🔄 再生成';
  }
}

function buildPost(ps){
  const intro=(INTRO[selCat]||INTRO['高料率①'])[selEvt]||(INTRO[selCat]||INTRO['高料率①'])['通常'];
  const lines=ps.map((p,i)=>`${['①','②','③'][i]} ${p.name||'（商品名）'}\n${p.url||'（URL）'}`).join('\n');
  let post=`${intro}\n\n${lines}\n\n#PR #楽天市場 #ad ${CT[selCat]||''}`;
  post=autoNG(post);
  document.getElementById('postBox').textContent=post;
  updCnt(post);runNG(post);
}
function autoNG(t){let r=t;Object.entries(NGR).forEach(([b,g])=>{r=r.replace(new RegExp(b,'g'),g);});return r;}
function runNG(t){const f=NGW.filter(w=>t.includes(w));const b=document.getElementById('ngBox');if(f.length){b.className='ng-box show ng-warn';b.innerHTML=`🚫 NG: ${f.map(w=>`<strong>${escH(w)}</strong>`).join('、')}`;} else{b.className='ng-box show ng-ok';b.textContent='✅ NGワードなし';}}
function onInput(){const t=document.getElementById('postBox').textContent||'';updCnt(t);runNG(t);}
function updCnt(t){const c=xchars(t);const e=document.getElementById('charCount');e.textContent=`${c} / 280`;e.className='char-cnt '+(c>280?'char-over':c>240?'char-warn':'char-ok');}
function copyPost(){const t=document.getElementById('postBox').textContent||'';if(xchars(t)>280){toast('文字数オーバーです',true);return;}const ng=NGW.filter(w=>t.includes(w));if(ng.length&&!confirm(`NG「${ng[0]}」が含まれます。コピーしますか？`))return;cp(t);}

function genImg(){
  const W=1080,H=1080;
  const cv=document.getElementById('cv');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0f0f14');bg.addColorStop(1,'#1a0a2e');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.12;
  const g1=c.createRadialGradient(W*.8,H*.15,0,W*.8,H*.15,W*.5);g1.addColorStop(0,'#a855f7');g1.addColorStop(1,'transparent');
  c.fillStyle=g1;c.fillRect(0,0,W,H);
  const g2=c.createRadialGradient(W*.2,H*.85,0,W*.2,H*.85,W*.45);g2.addColorStop(0,'#ff6b9d');g2.addColorStop(1,'transparent');
  c.fillStyle=g2;c.fillRect(0,0,W,H);c.restore();
  c.font='bold 34px sans-serif';c.fillStyle='rgba(255,255,255,.4)';c.textAlign='left';
  c.fillText('@おとな偏愛Lab',64,68);
  const em=CE[selCat]||'🛍️';
  const el=selEvt==='通常'?'':`【${selEvt}】`;
  c.font='bold 52px sans-serif';c.fillStyle='#ff6b9d';
  c.fillText(`${em} ${selCat} ${el}`,64,148);
  const gL=c.createLinearGradient(64,0,W-64,0);gL.addColorStop(0,'#a855f7');gL.addColorStop(1,'#ff6b9d');
  c.strokeStyle=gL;c.lineWidth=3;c.beginPath();c.moveTo(64,178);c.lineTo(W-64,178);c.stroke();
  const pt=(document.getElementById('postBox')?.textContent||'').trim();
  c.font='bold 38px sans-serif';c.fillStyle='#f0f0f5';c.textAlign='left';
  wrapT(c,(pt.split('\n')[0]||''),64,248,W-128,52);
  prods.slice(0,3).forEach((p,i)=>{
    if(!p)return;
    const y=380+i*200;
    c.save();c.globalAlpha=.18;c.fillStyle='#fff';rr(c,64,y-54,W-128,170,20);c.fill();c.restore();
    const bg2=c.createLinearGradient(64,y-54,200,y-54);bg2.addColorStop(0,'#a855f7');bg2.addColorStop(1,'#ff6b9d');
    c.fillStyle=bg2;rr(c,64,y-54,120,62,12);c.fill();
    c.font='bold 40px sans-serif';c.fillStyle='#fff';c.textAlign='center';c.fillText(['①','②','③'][i],124,y-8);
    c.font='bold 36px sans-serif';c.fillStyle='#f0f0f5';c.textAlign='left';
    const nm=(p.name||'').slice(0,22)+((p.name||'').length>22?'…':'');
    c.fillText(nm,200,y-8);
    if(p.url){c.font='24px sans-serif';c.fillStyle='rgba(255,107,157,.8)';c.fillText(p.url.replace(/https?:\/\//,'').slice(0,42)+'…',200,y+48);}
  });
  c.font='bold 30px sans-serif';c.fillStyle='rgba(168,85,247,.9)';c.textAlign='center';
  c.fillText('#PR  #楽天市場  #ad',W/2,H-60);
  document.getElementById('dlBtn').style.display='';
}
function wrapT(c,t,x,y,mW,lH){const w=t.split('');let l='';for(let i=0;i<w.length;i++){const ts=l+w[i];if(c.measureText(ts).width>mW&&l){c.fillText(l,x,y);l=w[i];y+=lH;}else l=ts;}if(l)c.fillText(l,x,y);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function dlImg(){const a=document.createElement('a');a.download=`ohenai_${Date.now()}.png`;a.href=document.getElementById('cv').toDataURL('image/png');a.click();toast('保存しました ✓');}

function initHeader(){
  const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('hdrDate').textContent=`${d.getMonth()+1}/${d.getDate()}（${wd}）`;
  setDay(d.getDay()===0||d.getDay()===6?'we':'wd');
}
(function(){renderEvts();loadCfg();initHeader();})();
</script>
